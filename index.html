<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>芙宁娜 · 2.32 MB 的 Live2D</title>
<style>
  :root{
    --ink:#eef4ff; --dim:#8ea4c6; --faint:#5f7395;
    --line:rgba(140,185,255,.13);
    --accent:#8fd4ff;
    --bg0:#070c16; --bg1:#0d1730;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg0); color:var(--ink);
    font:400 15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(780px 620px at 72% 34%, rgba(78,140,255,.20), transparent 68%),
      radial-gradient(600px 520px at 18% 84%, rgba(120,90,220,.13), transparent 70%),
      linear-gradient(168deg, var(--bg1), var(--bg0) 62%);
  }
  .bg::after{content:"";position:absolute;inset:0;opacity:.45;
    background-image:linear-gradient(rgba(120,170,255,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(120,170,255,.055) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(72% 62% at 50% 44%,#000 26%,transparent 100%);
    -webkit-mask-image:radial-gradient(72% 62% at 50% 44%,#000 26%,transparent 100%);
  }

  .wrap{position:relative;z-index:1;height:100%;display:flex;align-items:stretch;
    justify-content:center;gap:clamp(8px,3.2vw,84px)}
  .copy{flex:0 0 clamp(300px,35vw,540px);
    padding:clamp(24px,6vh,70px) 0 clamp(24px,6vh,70px) clamp(20px,4vw,64px);
    display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,2.6vh,26px)}
  .stage{position:relative;flex:0 0 auto;display:flex;align-items:flex-end;
    justify-content:center;padding-bottom:clamp(28px,6vh,64px)}

  .tag{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;
    padding:6px 13px 6px 10px;border:1px solid var(--line);border-radius:999px;
    font-size:12.5px;letter-spacing:.04em;color:var(--dim);background:rgba(120,170,255,.045)}
  .tag i{width:6px;height:6px;border-radius:50%;background:#5ce0b0;
    box-shadow:0 0 10px #5ce0b0;display:block}

  h1{margin:0;font-size:clamp(28px,3.4vw,47px);line-height:1.12;font-weight:650;letter-spacing:-.02em}
  h1 em{font-style:normal;
    background:linear-gradient(96deg,#9fdcff,#c3b6ff 58%,#9fdcff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:0;color:var(--dim);max-width:48ch;font-size:15px}
  .sub b{color:var(--ink);font-weight:600}
  code{font:400 .92em/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:1px 5px;border-radius:5px;background:rgba(140,185,255,.09);color:#a9c8ee}

  .bars{display:flex;flex-direction:column;gap:11px;max-width:430px;margin:2px 0}
  .bar{display:grid;grid-template-columns:92px 1fr 76px;align-items:center;gap:12px;font-size:12.5px}
  .bar span:first-child{color:var(--faint)}
  .bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
  .track{height:9px;border-radius:99px;background:rgba(140,180,255,.09);overflow:hidden}
  .fill{height:100%;border-radius:99px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .fill.old{background:linear-gradient(90deg,#37455f,#5b6c8e);animation-delay:.05s}
  .fill.new{background:linear-gradient(90deg,#4aa8e0,#9fd8ff 58%,#c9b6ff);animation-delay:.22s}

  .meta{display:flex;gap:clamp(16px,2.4vw,30px);flex-wrap:wrap;padding-top:4px}
  .meta div{display:flex;flex-direction:column;gap:1px}
  .meta b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .meta i{font-style:normal;font-size:11px;color:var(--faint);letter-spacing:.07em;text-transform:uppercase}

  #f{width:420px;filter:drop-shadow(0 30px 60px rgba(40,90,190,.3))}
  .halo{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);
    width:min(76%,540px);aspect-ratio:1;border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side,rgba(130,190,255,.20),transparent 72%);filter:blur(8px)}
  .glow{position:absolute;left:50%;bottom:0;width:74%;height:34%;transform:translateX(-50%);
    background:radial-gradient(60% 100% at 50% 100%,rgba(150,200,255,.15),transparent 72%);pointer-events:none}

  .panel{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:5;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:22px;
    background:rgba(12,22,40,.72);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 34px rgba(0,0,0,.42)}
  .panel .row{display:flex;align-items:center;gap:3px;max-width:calc(100vw - 32px);
    overflow-x:auto;scrollbar-width:none}
  .panel .row::-webkit-scrollbar{display:none}
  .panel .row.exp{padding-top:1px;border-top:1px solid rgba(140,185,255,.09)}
  .panel button{appearance:none;border:0;background:transparent;color:var(--faint);
    font:inherit;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;
    transition:.16s;white-space:nowrap}
  .panel button:hover{color:var(--dim);background:rgba(140,185,255,.07)}
  .panel button.on{color:#0a1220;background:linear-gradient(180deg,#bfe6ff,#8fd4ff);
    font-weight:600;box-shadow:0 2px 12px rgba(120,200,255,.35)}

  .boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:var(--bg0);transition:opacity .5s,visibility .5s}
  .boot.done{opacity:0;visibility:hidden;pointer-events:none}
  .boot p{margin:0;color:var(--faint);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
  .boot .sp{width:24px;height:24px;margin:0 auto 16px;border-radius:50%;
    border:2px solid rgba(140,185,255,.16);border-top-color:var(--accent);
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:860px){
    .wrap{gap:0}
    .copy{display:none}
    .stage{flex:1 1 auto;align-items:flex-end;padding-bottom:clamp(56px,9vh,96px)}
    .wrap{min-height:100%}
    #f{width:min(100vw,440px)}
    .panel{bottom:12px;max-width:calc(100vw - 16px)}
    .panel .row{flex-wrap:nowrap}
    .panel button{padding:6px 8px;font-size:11.5px}
    .panel .row.exp button.opt{display:none}
  }
</style>
</head>
<body>
<div class="bg"></div>

<div class="wrap">
  <div class="copy">
    <div class="tag"><i></i> 零依赖 · 纯 WebGL · 可直接嵌站</div>
    <h1>芙宁娜<br><em>2.32 MB</em> 的 Live2D</h1>
    <p class="sub">
      原模型是一个 <b>95.5 MB</b> 的 <code>moc3</code>，浏览器得先下完才能动。
      这里把它拆成量化网格 + 一张 WebP 图集：<b>不用 Cubism Core，不引任何运行时库</b>，
      光栅化是一段手写的 WebGL。<br>
      眨眼、表情、呼吸、发丝与裙摆、体态摇曳、呆毛弹簧物理都是<b>真帧数据</b>或顶点着色器算的，她不会僵在原地。
    </p>

    <div class="bars">
      <div class="bar"><span>原始 moc3</span><div class="track"><div class="fill old" style="width:100%"></div></div><span>95.5 MB</span></div>
      <div class="bar"><span>本方案</span><div class="track"><div class="fill new" style="width:2.4%"></div></div><span>2.32 MB</span></div>
    </div>

    <div class="meta">
      <div><b id="m-v">189,069</b><i>顶点</i></div>
      <div><b id="m-d">167</b><i>draw call</i></div>
      <div><b id="m-t">—</b><i>解析</i></div>
      <div><b>41×</b><i>压缩比</i></div>
    </div>
  </div>

  <div class="stage">
    <div class="halo"></div>
    <div class="glow"></div>
    <div id="f"></div>
  </div>
</div>

<div class="panel">
  <div class="row">
    <button data-k="follow" class="on">视线跟随</button>
    <button data-k="idle" class="on">呼吸</button>
    <button data-k="clip" class="on">裁剪遮罩</button>
    <button data-k="plate">声明牌</button>
    <button data-k="wand" class="on">权杖</button>
    <button data-k="auto" class="on">自动表情</button>
  </div>
  <div class="row exp">
    <button data-e="0" class="on">常态</button>
    <button data-e="5">微笑</button>
    <button data-e="6" class="opt">猫嘴</button>
    <button data-e="7">张嘴</button>
    <button data-e="8">生气</button>
    <button data-e="9" class="opt">哭</button>
    <button data-e="10">脸红</button>
    <button data-e="1">瞟左</button>
    <button data-e="2">瞟右</button>
  </div>
</div>

<div class="boot" id="boot"><div><div class="sp"></div><p>loading</p></div></div>

<script src="./dist/furina-mini.js"></script>
<script>
(function () {
  var host = document.getElementById('f');
  var boot = document.getElementById('boot');
  var pEl = boot.querySelector('p');

  /* 宽度跟着视口高度走，保证整只模型不出画 */
  function fit() {
    var vh = window.innerHeight, vw = window.innerWidth;
    var byH = (vh * (vw < 860 ? 0.90 : 0.92)) / 1.5;
    var byW = vw < 860 ? vw * 0.98 : vw * 0.44;
    host.style.width = Math.round(Math.min(byH, byW, 512)) + 'px';
  }
  fit();
  window.addEventListener('resize', fit);

  var t0 = performance.now(), m = null;

  /* ---------- 多线路加载：GitHub Pages 国内直连很慢（~10KB/s），
     jsDelivr 的 Cloudflare 线路实测快 10 倍以上。
     脚本和资源都在同一目录，所以先动态加载脚本、再把同目录当 base。
     ?line=cdn|jsdelivr|github 可强制线路，默认自动依次尝试 ---------- */
  var LINES = [
    { n: '本站', root: '' },
    { n: 'Cloudflare CDN', root: 'https://testingcf.jsdelivr.net/gh/827802685/Live2D@master/' },
    { n: 'GitHub Pages', root: 'https://827802685.github.io/Live2D/' },
    { n: 'jsDelivr', root: 'https://cdn.jsdelivr.net/gh/827802685/Live2D@master/' }
  ];
  /* 同域（本地部署）与仓库目录各备选一个路径，谁的 furina-mini.js 在就用谁 */
  var CAND = ['furina-mini/furina-mini.js', 'dist/furina-mini.js'];

  var qs = new URLSearchParams(location.search);
  var forced = qs.get('line');
  if (forced === 'cdn') LINES.unshift(LINES[1]);
  else if (forced === 'jsdelivr') LINES.unshift(LINES[3]);
  else if (forced === 'github') LINES.unshift(LINES[2]);

  function loadScript(url, timeoutMs) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      var done = 0, timer = setTimeout(function () {
        if (done) return; done = 1; s.remove(); rej(new Error('timeout'));
      }, timeoutMs || 12000);
      s.src = url;
      s.onload = function () { if (done) return; done = 1; clearTimeout(timer); res(); };
      s.onerror = function () { if (done) return; done = 1; clearTimeout(timer); s.remove(); rej(new Error('load fail')); };
      document.head.appendChild(s);
    });
  }

  function bootText(s) { pEl.textContent = s; }

  function bootFail(msg, hint) {
    boot.innerHTML = '<div style="text-align:center;color:#ff9aa2;font-size:13px;line-height:1.9">' +
      msg + (hint ? '<br><span style="color:#5f7395">' + hint + '</span>' : '') + '</div>';
  }

  /* 依次试线路，谁先给出 FurinaMini 就用谁的目录做 base */
  (function tryLoad(idx) {
    if (window.FurinaMini) return start();       // 本地直接打开且已同域加载
    if (idx >= LINES.length * CAND.length) {
      return bootFail('脚本加载失败', '请检查网络后刷新重试');
    }
    var line = LINES[(idx / CAND.length) | 0];
    var path = CAND[idx % CAND.length];
    bootText('连接 ' + line.n + ' …');
    loadScript(line.root + path, line.root ? 14000 : 6000)
      .then(function () { start(line, path); })
      .catch(function () { tryLoad(idx + 1); });
  })(0);

  function start(line, path) {
    var base = line ? line.root + path.replace(/[^/]*$/, '') : './dist/';
    FurinaMini.mount('#f', {
      size: parseInt(host.style.width, 10) || 420,
      base: base,
      frames: ['blink', 'eyeLeft', 'eyeRight', 'eyeUp', 'eyeDown',
               'smile', 'catMouth', 'mouthOpen', 'angry', 'cry', 'blush'],
      progress: function (got, total) {
        var pct = total ? Math.min(100, Math.round(got / total * 100)) : 0;
        bootText('加载模型 ' + pct + '%' + (line ? ' · ' + line.n : ''));
      }
    })
      .then(function (model) {
        m = window.__m = model;
        document.getElementById('m-t').textContent = Math.round(performance.now() - t0) + ' ms';
        document.getElementById('m-v').textContent = model.vertCount.toLocaleString('en-US');
        document.getElementById('m-d').textContent = model.runV0.length;
        boot.classList.add('done');
      })
      .catch(function (e) {
        bootFail('加载失败：' + (e && e.message ? e.message : e),
          '请用 http(s) 打开，file:// 会被 CORS 挡住');
      });
  }

  /* 控制条：直接改组件开关，不用重建 */
  Array.prototype.forEach.call(document.querySelectorAll('.panel button'), function (b) {
    b.addEventListener('click', function () {
      if (!m) return;
      var k = b.dataset.k, on = !b.classList.contains('on');
      b.classList.toggle('on', on);
      if (k === 'follow') {
        m.o.follow = on;
        if (!on) { m.target.x = m.target.y = 0; }
      } else if (k === 'idle') {
        m.o.idle = on;
        if (!on) m.draw(performance.now());
      } else if (k === 'clip') {
        m.o.clip = on;
      } else if (k === 'auto') {
        m.o.autoExpr = on;
        if (!on) m.setExpression(0);
      } else if (k === 'wand') {
        m.setWand(on);
        if (on) m.draw(performance.now());
      } else if (k === 'plate') {
        m.o.hidePlate = !on;   // 按钮亮 = 显示声明牌
        m.rebuild();
        document.getElementById('m-v').textContent = m.vertCount.toLocaleString('en-US');
        document.getElementById('m-d').textContent = m.runV0.length;
      }
    });
  });

  /* 表情行：手动点选后自动表情暂停表现，由保持时间到点回落 */
  var chips = document.querySelectorAll('.row.exp button');
  Array.prototype.forEach.call(chips, function (b) {
    b.addEventListener('click', function () {
      if (!m) return;
      Array.prototype.forEach.call(chips, function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      m.setExpression(parseInt(b.dataset.e, 10) || 0, 5000);
    });
  });
})();
</script>
</body>
</html>
