<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Furina Live2D</title>
<style>
body { margin: 0; background: #1a1a2e; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
#status { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); color: #888; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">加载中...</div>
<script src="js/pixi.min.js"></script>
<script src="js/live2dcubismcore.min.js"></script>
<script src="js/cubism4.min.js"></script>
<script>
var app = new PIXI.Application({ view: document.getElementById('c'), width: window.innerWidth, height: window.innerHeight, transparent: true });
PIXI.live2d.Live2DModel.from('model/furina/furina.model3.json').then(function(model) {
  model.scale.set(0.5, 0.5);
  model.anchor.set(0.5, 0.5);
  model.position.set(app.screen.width / 2, app.screen.height / 2);
  app.stage.addChild(model);
  model.motion('Idle');
  document.getElementById('status').textContent = '已加载';
}).catch(function(e) {
  console.error(e);
  document.getElementById('status').textContent = '加载失败: ' + e.message;
});
</script>
</body>
</html>
